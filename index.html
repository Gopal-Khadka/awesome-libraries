<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <meta
      name="description"
      content="A curated list of awesome libraries for building applications - covering React, Next.js, FastAPI, Django, JavaScript, TypeScript, Python, and Bash"
    />
    <meta
      name="keywords"
      content="awesome,libraries,react,nextjs,fastapi,django,javascript,typescript,python,bash,learning,resources"
    />
    <title>Awesome Learning - Curated Libraries & Resources</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <!-- Tailwind CSS (generated) -->
    <link rel="stylesheet" href="./assets/output.css" />

    <!-- Docsify Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  </head>
  <body>
    <div id="app">Loading...</div>

    <script>
      window.$docsify = {
        // Basic settings
        name: 'Awesome Learning',
        repo: 'https://github.com/your-username/awesome-learning',
        homepage: 'README.md',

        // Load navbar
        loadNavbar: true,

        // Navigation
        auto2top: true,
        maxLevel: 4,
        subMaxLevel: 3,

        // Routing
        relativePath: true,

        // Search plugin
        search: {
          maxAge: 86400000, // 1 day cache
          paths: 'auto',
          placeholder: 'Search libraries & tools...',
          noData: 'No results found.',
          depth: 3,
          hideOtherSidebarContent: false
        },

        // Copy code blocks
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Error',
          successText: 'Copied!'
        },

        // Pagination
        pagination: {
          previousText: 'Previous',
          nextText: 'Next',
          crossChapter: true,
          crossChapterText: true
        },

        // Customization
        themeColor: '#3b82f6',

        // 404 page
        notFoundPage: '_404.md',

        // Footer plugin
        plugins: [
          function(hook, vm) {
            hook.beforeEach(function(html) {
              // Add last updated timestamp
              const url = 'https://github.com/Gopal-Khadka/awesome-libraries/blob/main/' + vm.route.file
              const editLink = '[:memo: Edit this page on GitHub](' + url + ')\n\n'
              return editLink + html
            })

            hook.afterEach(function(html) {
              // Add footer
              const footer = [
                '<hr/>',
                '<footer style="text-align: center; padding: 20px 0; color: #6b7280;">',
                '<p>Made with ❤️ by the community | ',
                '<a href="https://github.com/your-username/awesome-learning" target="_blank" style="color: #3b82f6;">GitHub</a>',
                '</p>',
                '</footer>'
              ].join('')
              return html + footer
            })
          }
        ]
      }
    </script>

    <!-- Docsify core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

    <!-- Docsify plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>

    <!-- Prism syntax highlighting -->
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  </body>
</html>
